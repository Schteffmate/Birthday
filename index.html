<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />

  <title>AR Installation</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR für Image Tracking -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #start-screen {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      box-sizing: border-box;
      color: white;
      background: #000;
      text-align: center;
    }

    #start-screen h1 {
      font-size: 1.8rem;
      font-weight: 400;
      margin-bottom: 12px;
    }

    #start-screen p {
      max-width: 320px;
      line-height: 1.6;
      color: #ccc;
    }

    #start-button {
      margin-top: 24px;
      padding: 15px 28px;
      border: 1px solid white;
      border-radius: 30px;
      background: white;
      color: black;
      font-size: 1rem;
      cursor: pointer;
    }

    #status {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      width: max-content;
      max-width: 85%;
      padding: 10px 16px;
      border-radius: 24px;
      background: rgba(0, 0, 0, 0.65);
      color: white;
      font-size: 14px;
      text-align: center;
      pointer-events: none;
    }

    #status:empty {
      display: none;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <div id="start-screen">
    <h1>AR Installation</h1>
    <p>
      Richte deine Handykamera auf das Bild.
      Sobald es erkannt wird, erscheint das 3D-Objekt.
    </p>
    <button id="start-button">Installation starten</button>
  </div>

  <div id="status"></div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;
                  autoStart: false;
                  uiScanning: false;
                  uiLoading: no;
                  maxTrack: 1;"
    embedded
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-assets>
      <a-asset-item
        id="ar-model"
        src="./model.glb">
      </a-asset-item>
    </a-assets>

    <!--
      targetIndex 0 = erstes Bild in targets.mind
      Das Modell liegt zunächst mittig auf dem Bild.
    -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-gltf-model
        src="#ar-model"
        position="0 0 0"
        rotation="0 0 0"
        scale="0.3 0.3 0.3"
      ></a-gltf-model>
    </a-entity>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>
  </a-scene>

  <script>
    const startScreen = document.getElementById("start-screen");
    const startButton = document.getElementById("start-button");
    const status = document.getElementById("status");
    const scene = document.querySelector("a-scene");
    const target = document.querySelector("[mindar-image-target]");

    let mindarSystem;
    let started = false;

    scene.addEventListener("loaded", () => {
      mindarSystem = scene.systems["mindar-image-system"];
    });

    target.addEventListener("targetFound", () => {
      status.textContent = "Bild erkannt";
    });

    target.addEventListener("targetLost", () => {
      status.textContent = "Suche das Bild ...";
    });

    startButton.addEventListener("click", async () => {
startButton.disabled = true;
status.textContent = "Kamera wird gestartet ...";

try {
if (!scene.hasLoaded) {
await new Promise((resolve) => {
scene.addEventListener("loaded", resolve, { once: true });
});
}

startScreen.classList.add("hidden");

mindarSystem = scene.systems["mindar-image-system"];
await mindarSystem.start();

status.textContent = "Suche das Bild ...";
} catch (error) {
console.error("AR-Start fehlgeschlagen:", error);

startScreen.classList.remove("hidden");
status.textContent =
"Fehler beim Start. Bitte Seite neu laden.";

startButton.disabled = false;
startButton.textContent = "Erneut versuchen";
}
});
